[project]
name = "backgroundagent"
version = "0.1.0"
description = "Background coding agent — runs tasks in isolated cloud environments and produces pull requests"
requires-python = ">=3.13"
dependencies = [
    "boto3==1.42.54",
    "claude-agent-sdk==0.1.53",
    "requests==2.33.0",
    "fastapi==0.135.2",
    "uvicorn==0.42.0",
    "aws-opentelemetry-distro~=0.15.0",
    "mcp==1.23.0",
    "cedarpy>=4.8.0",
    "python-ulid>=3.1.0",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = [
    "B101",  # assert_used — tests use assert, ruff S101 handles per-file
    "B602",  # subprocess shell=True — needed for shell tool execution
    "B603",  # subprocess calls — needed for shell tool execution
    "B607",  # partial executable paths — sh -c pattern is safe
    "B701",  # jinja2_autoescape_false — templates are LLM prompts, not web HTML
]


[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pytest",
    "pygments==2.20.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "S",     # flake8-bandit (security)
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific rules
]
ignore = [
    "S603",  # subprocess call — allowed for agent CLI operations
    "S607",  # partial executable path — agent relies on PATH for git, gh, mise
]

[tool.ruff.lint.per-file-ignores]
"src/entrypoint.py" = ["E402"]
"src/system_prompt.py" = ["E501"]
"src/prompts/*.py" = ["E501"]
"tests/**" = ["S101", "S106", "S108", "E402"]
# AKW ported files: Unicode math, exception chaining, broad except (fail-open patterns)
"src/interfaces/ltm.py" = ["RUF002", "RUF003", "B027"]
"src/registry/capability_index.py" = ["RUF002", "RUF003", "S110", "SIM102"]
"src/registry/filesystem.py" = ["B904", "S112"]
"src/backends/ltm/mem0.py" = ["SIM105", "S110", "E501"]
"src/backends/ltm/mock.py" = ["RUF002", "B007", "E501"]
"src/ltm_memory/recall.py" = ["RUF002", "RUF003", "TC001"]
"src/ltm_memory/lifecycle.py" = ["RUF002", "RUF003"]
"src/blueprint_tracker.py" = ["S110", "E501"]
"src/preflight/pipeline.py" = ["B904", "S110"]
"src/preflight/handler.py" = ["S110", "B904"]
"src/pattern_evaluator.py" = ["F841", "B905", "E501", "S324"]
"src/sandbox/sandbox_manager.py" = ["S603", "S607", "S102", "S110", "B904"]
"src/sandbox/secret_manager.py" = ["B007"]
"src/agents/blueprint_builder/agent.py" = ["S110", "B904"]
"src/tools/blueprint_builder_tools.py" = ["S110", "B904"]
"src/agents/tool_builder/agent.py" = ["S110", "B904", "RUF002"]
"src/tools/tool_builder_tools.py" = ["S110", "B904", "S311"]
"src/trust/models.py" = ["E241", "RUF002", "RUF003"]
"src/trust/emitter.py" = ["B904", "S110", "RUF002", "RUF003"]
"src/trust/store.py" = ["B027", "RUF002", "RUF003"]
"src/trust/graduation.py" = ["B904", "S110", "RUF002", "RUF003"]
"src/trust/dynamo_store.py" = ["S110", "B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ty.environment]
python-version = "3.13"
extra-paths = ["src"]

[[tool.ty.overrides]]
# Ported AKW agent facades import AKW-only modules (tools.base) not present in ABCA
include = ["src/agents/tool_builder/agent.py", "src/agents/blueprint_builder/agent.py"]
rules = { unresolved-import = "ignore", invalid-argument-type = "ignore", no-matching-overload = "ignore" }
