id: meta/blueprint-builder-v1
version: "1"
task_mode: knowledge
task_types:
  - generate_blueprint

system_prompt: |
  You are the Blueprint Builder Agent. You generate YAML blueprint specifications
  for the AutonomousKnowledgeWork platform from natural language descriptions.

  PROCESS:
  1. Call search_blueprint_index to check if a blueprint already exists for this need.
     If found with confidence >= 0.8, call finish with status=existing_match.

  2. Call search_capability_index to discover what tools already exist that are
     relevant to this domain.

  3. Call generate_blueprint with a complete blueprint specification including:
     - system_prompt: the agent's operating instructions
     - tools: full tool definitions (name, description, input_schema)
     - phases: ordered stages with goals and completion signals
     - hitl_conditions: machine-readable conflict detection rules
     - output_schema: structure of the finish call
     - parameters: named values referenced in prompts

  4. Call validate_blueprint to check the schema is correct.
     Fix any errors and re-generate if needed.

  5. Call register_blueprint_action to write the YAML file and register in the index.

  6. If the blueprint declares tools that do not exist in the registry,
     note them in the finish summary — they will need to be generated by
     the Tool Builder Agent before the blueprint can run.

  7. Call finish with status=registered and a summary.

  CONSTRAINTS:
  - system_prompt must include: PROCESS steps, CONSTRAINTS, and PARAMETERS section
  - Every tool in the tools: section must have name, description, and input_schema
  - hitl_conditions must have trigger, question_template, and options
  - parameters must list all {placeholder} values used in system_prompt
  - Never use domain-specific knowledge that belongs in the system_prompt

tools:
  - name: search_blueprint_index
    description: Search existing blueprints by capability description. Returns matches with confidence scores.
    input_schema:
      type: object
      properties:
        description: {type: string, description: What the blueprint needs to do}
        min_confidence: {type: number, default: 0.6}
      required: [description]

  - name: search_capability_index
    description: Find existing tools that could be used in this blueprint.
    input_schema:
      type: object
      properties:
        description: {type: string}
        min_confidence: {type: number, default: 0.5}
      required: [description]

  - name: generate_blueprint
    description: Generate a complete blueprint YAML specification.
    input_schema:
      type: object
      properties:
        blueprint_id: {type: string, description: "domain/name-v1 format"}
        task_types: {type: array, items: {type: string}}
        domain_description: {type: string, description: What this blueprint does}
        system_prompt: {type: string}
        tools:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              description: {type: string}
              input_schema: {type: object}
        phases:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              goal: {type: string}
              tools_expected: {type: array}
              completion_signal: {type: string}
        hitl_conditions: {type: array}
        output_schema: {type: object}
        parameters: {type: object}
        required_ltm_capabilities: {type: array}
        max_iterations: {type: integer, default: 20}
        max_tokens: {type: integer, default: 50000}
      required: [blueprint_id, task_types, system_prompt, tools]

  - name: validate_blueprint
    description: Validate a blueprint specification against the schema.
    input_schema:
      type: object
      properties:
        blueprint_id: {type: string}
        blueprint_yaml: {type: string, description: Full YAML content to validate}
      required: [blueprint_id, blueprint_yaml]

  - name: register_blueprint_action
    description: Write the blueprint YAML file and register it in the blueprint index.
    input_schema:
      type: object
      properties:
        blueprint_id: {type: string}
        blueprint_yaml: {type: string}
        missing_tools: {type: array, items: {type: string}, description: Tools declared but not in registry}
      required: [blueprint_id, blueprint_yaml]

  - name: finish
    description: Signal blueprint generation is complete.
    input_schema:
      type: object
      properties:
        blueprint_id: {type: string}
        status: {type: string, enum: [registered, existing_match, failed]}
        summary: {type: string}
        missing_tools: {type: array, items: {type: string}}
      required: [blueprint_id, status, summary]

phases:
  - name: search
    goal: Check if a matching blueprint already exists
    tools_expected: [search_blueprint_index, search_capability_index]
    completion_signal: search_complete == true

  - name: generate
    goal: Generate and validate the blueprint specification
    tools_expected: [generate_blueprint, validate_blueprint]
    completion_signal: validation_passed == true

  - name: register
    goal: Register the blueprint and report missing tools
    tools_expected: [register_blueprint_action, finish]
    completion_signal: finish_called == true

state_schema:
  search_complete: {type: boolean}
  validation_passed: {type: boolean}
  generated_blueprint_id: {type: string}
  missing_tools: {type: list}

hitl_conditions:
  - trigger: missing_required_tools
    question_template: "Blueprint '{blueprint_id}' declares {count} tool(s) that don't exist yet: {missing_tools}. Should we proceed and generate those tools separately, or revise the blueprint to use existing tools?"
    options:
      - {id: proceed_generate_tools, label: "Register blueprint and generate missing tools separately"}
      - {id: revise_use_existing, label: "Revise blueprint to use only existing tools"}
      - {id: abort, label: "Abort blueprint generation"}

output_schema:
  type: object
  properties:
    blueprint_id: {type: string}
    status: {type: string}
    summary: {type: string}
  required: [blueprint_id, status]

parameters:
  max_generation_attempts: 2

required_ltm_capabilities:
  - SEMANTIC_SEARCH
  - WRITE

max_iterations: 30
max_tokens: 100000
