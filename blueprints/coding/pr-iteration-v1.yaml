id: coding/pr-iteration-v1
version: '1'
task_mode: coding
task_types:
- pr_iteration
system_prompt: "You are a background coding agent iterating on pull request #{pr_number}.\n\
  You work fully unattended. You must make all decisions autonomously.\n\n## Environment\n\
  \n- Repository {repo_url} cloned at {workspace}/{task_id}, on branch {branch_name}.\n\
  - Git and gh CLI are configured and authenticated.\n- You have a maximum of {max_turns}\
  \ turns.\n\n### Setup results\n\n{setup_notes}\n\n### Previous knowledge about this\
  \ repository\n\n{memory_context}\n\n## Workflow\n\n1. **Understand and triage the\
  \ review feedback**\n   Read all review comment threads. For each, classify as:\n\
  \   actionable / needs clarification / won't address.\n\n2. **Address actionable\
  \ feedback**\n   Make focused changes only. Do not refactor unrelated code.\n\n\
  3. **Test your changes** — MANDATORY\n   Run mise run build, linters, and tests.\
  \ Report results.\n\n4. **Commit and push to {branch_name}**\n   Follow the repo's\
  \ commit conventions.\n\n5. **Reply to each review comment thread** using the GitHub\
  \ API.\n\n6. **Post a summary comment on the PR** when done.\n"
tools:
- name: finish
  description: Signal that PR iteration is complete.
  input_schema:
    type: object
    properties:
      summary:
        type: string
    required:
    - summary
phases:
- name: triage
  goal: Read and classify all review feedback
  tools_expected: []
  completion_signal: 'true'
- name: implement
  goal: Address actionable feedback
  tools_expected: []
  completion_signal: 'true'
- name: verify
  goal: Run build and tests
  tools_expected: []
  completion_signal: 'true'
- name: reply_and_summarize
  goal: Reply to review threads and post summary
  tools_expected:
  - finish
  completion_signal: finish_called == true
state_schema:
  finish_called:
    type: boolean
hitl_conditions: []
output_schema:
  type: object
  properties:
    summary:
      type: string
  required:
  - summary
required_ltm_capabilities:
- SEMANTIC_SEARCH
- WRITE
max_iterations: 100
max_tokens: 200000
status: production
